<link rel="stylesheet" href="css/sign-up.css">
<!DOCTYPE html>
<html lang="id">
<head>
    <title>Game Tracker</title>
</head>
<body>
    <div class="kotak">
        <div class="form-sign-in">
            <h1>Create Your Account</h1>
            <form action="">
                <label>Email</label>
                <label class="input-sign-in">
                <span class="icon"><img src="./icon/email.png" alt="un"></span>
                <input type="text" placeholder="Example@gmail.com" id="email" required>
                </label>
                <label>Username</label>
                <label class="input-sign-in">
                <span class="icon"><img src="./icon/proicons--person.png" alt="un"></span>
                <input type="text" placeholder="Username" id="username" required>
                </label>
                <label>Password</label>
                <label class="input-sign-in">
                <span class="icon"><img src="./icon/si--lock-line.png" alt="pw"></span>
                <input type="password" placeholder="Password" id="password" required>
                </label>
                <label>Confirm Password</label>
                <label class="input-sign-in">
                <span class="icon"><img src="./icon/lock.png" alt="pw"></span>
                <input type="password" placeholder="Confirm Password" id="confirm-password" required>
                </label>
                <button type="button" class="btn-sign-in" onclick="window.location.href='index.html'">Sign Up</button>
                <div class="already">
                    <p>Already have an account? <a href="index.html">Sign In</a></p>
                </div>
            </form>
        </div>
        <div class="kotak-sign-in">
            <img src="./background/pombensin-kecil.gif" alt="hujan">
        </div>
    </div>
</body>
</html>
