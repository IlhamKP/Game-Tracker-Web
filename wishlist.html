<link rel="stylesheet" href="css/wishlist.css">
<!DOCTYPE html>
<html lang="en">
<head>
    <title>Game Tracker</title>
    <img src="">
</head>
<body>
    <div class="heading">
        <h1>Game <br>Tracker</h1>
        <div class="menu">
                <a href="dashboard.html">Dashboard</a> 
                <a href="library.html">Library</a>
                <a href="wishlist.html">Wishlist</a>
        </div>
        <div class="profile">
            <a onclick="profile(); return false;"><img src="https://i.pinimg.com/736x/fc/7c/3b/fc7c3b11ed402d81ab8918b9a1304113.jpg" alt="logo"></a>     
        </div>
        <div class="box" id="box-option">
            <a href="#" class="option"><img src="icon/person-profile.png">Profile</a>
            <a href="index.html" class="option"><img src="icon/logout-profile.png">Sign Out</a>
        </div>
    </div>
    <div class="wishlist">
        <div class="cari">
        <span class="icon"><img src="https://cdn-icons-png.flaticon.com/128/54/54481.png" alt="search logo" width="20px" height="20px"></span>
        <input type="text" placeholder="Cari game...">
        </div>
        <label></label>
    </div>
    <div class="tambah-game">
        <div id="daftarGame"></div>
        <div class="kotak-tambah-game">
            <button onclick="bukaTG()">Tambah Game</button>
        </div>
        <div class="overlay" id="overlay">
            <div class="popup">
                <h3>Tambah Game</h3>
                <div>
                    <label>Judul Game</label>
                    <input type="text" id="judulGame" placeholder="Judul Game" class="input-tg">
                </div>
                    <label>Genre</label>
                    <input list="genre" id="genreGame" placeholder="Genre" class="input-tg">
                    <datalist id="genre">
                        <option value="Action">Action</option>
                        <option value="Adventure">Adventure</option>
                        <option value="RPG">RPG</option>
                        <option value="FPS">FPS</option>
                        <option value="Strategy">Strategy</option>
                        <option value="Simulation">Simulation</option>
                        <option value="Horror">Horror</option>
                        <option value="Racing">Racing</option>
                        <option value="Sports">Sports</option>
                        <option value="Puzzle">Puzzle</option>
                    </datalist>
                    <label>Platform</label>
                    <div class="input-tg">
                        Steam<input type="checkbox" value="Steam">
                        Xbox<input type="checkbox" value="Xbox">
                        Playstation<input type="checkbox" value="Playstation">
                        Nintendo Switch<input type="checkbox" value="Nintendo Switch">
                    </div>
                    <label>Rating</label>
                    <input type="text" id="ratingGame" placeholder="1-10" class="input-tg">
                    <label>Cover Game</label>
                    <input type="file" class="input-tg" >
                <br><br>
                <button onclick="simpanGame()" class="btn-simpan">Simpan</button>
            </div>
        </div>
    </div>

<script>
    const menu = document.getElementById("box-option");
    const button = document.querySelector(".profile");

    function profile() {
        menu.classList.toggle("active");
    }

    document.addEventListener("click", function(event) {
        if (!menu.contains(event.target) && !button.contains(event.target)) {
            menu.classList.remove("active");
        }
    });

    function bukaTG() {
        document.getElementById("overlay").style.display = "flex";
    }

    function tutupTG() {
        document.getElementById("overlay").style.display = "none";
    }

    function simpanGame() {

        const judul = document.getElementById("judulGame").value;
        const genre = document.getElementById("genreGame").value;
        const rating = document.getElementById("ratingGame").value;

        if (judul === "") {
            alert("Masukkan judul game!");
            return;
        }

        const card = document.createElement("div");

        card.innerHTML = `
            <h3>${judul}</h3>
            <p>Genre : ${genre}</p>
            <p>Rating : ${rating}</p>
        `;

        card.style.background = "white";
        card.style.padding = "15px";
        card.style.margin = "10px";
        card.style.borderRadius = "10px";

        document.getElementById("daftarGame").appendChild(card);

        tutupTG();
    }
</script>
</body>
</html>
