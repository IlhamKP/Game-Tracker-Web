<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Tracker</title>
    <link rel="stylesheet" href= "css/librarycoba.css">
</head>
<body>
    <div class="header">
        <h1>Game<br>Tracker</h1>
        <div class="menu">
            <a href="dashboard.html">Dashboard</a>
            <a href="librarycoba.html">Library</a>
            <a href="wishlist.html">Wishlist</a>
        </div>
            <a onclick="profile()" href="#" class="profile"><img src="foto_profile/kucing.jpg" alt="profile"></a>
            <div class="box" id="box-option">
            <a href="#" class="option"><img src="icon/person-profile.png">Profile</a>
            <a href="index.html" class="option"><img src="icon/logout-profile.png">Sign Out</a>
            </div> 
    </div>
    <div class="tambah-game">
        <button onclick="bukaTG()">Tambah Game</button>
        <div class="overlay" id="overlay">
            <div class="popup">
                <h3>Tambah Game</h3>
                <a href="#" onclick="tutupTG()"><img src="icon/cross-icon.png"></a>
                <label>Judul Game</label>
                <input type="text" placeholder="Judul Game" class="input-tg">
                <label>Genre Game</label>
                <input type="text" placeholder="Genre Game" class="input-tg">
                <label>Platform</label>
                <div class="platform">
                    <span><input type="radio" name="pl">Steam</span>
                    <span><input type="radio" name="pl">Xbox</span>
                    <span><input type="radio" name="pl">Playstation</span>
                    <span><input type="radio" name="pl">Nintendo Switch</span>
                </div>
                <label>Status</label>
                <div class="platform">
                    <span><input type="radio" name="st">Belum dimainkan</span>
                    <span><input type="radio" name="st">Sedang dimainkan</span>
                    <span><input type="radio" name="st">Tamat</span>
                </div>
                <label>Rating</label>
                <input type="number" placeholder="1-10" class="input-tg">
                <label>Cover Game</label>
                <input type="file" class="input-tg">
                <button type="submit" onclick="tutupTG()" class="btn-simpan">Simpan</button>
            </div>
        </div>
    </div>
    <div class="cari-game">
        <span class="icon"><img src="https://cdn-icons-png.flaticon.com/128/54/54481.png" alt="search logo"></span>
        <input type="text" placeholder="Cari game...">
    </div>
    <div class="library">
        <div class="card-game">
            <img src="gambar-game/persona-5-royal.png">
            <div class="info-game">
            <h3>Persona 5 Royal</h3>
            <div class="detail">
                <label>Genre</label>
                <span>Action</span>
            </div>
            <div class="detail">
                <label>Platform</label>
                <span>Steam</span>
            </div>
            <div class="detail">
                <label>Status</label>
                <span>Belum dimainkan</span>
            </div>
            <div class="detail">
                <label>Rating</label>
                <span>-</span>
            </div>
             <div class="tombol">
                            <button><img src="icon/mdi--heart-outline.png"></button>
                            <button><img src="icon/edit-outline.png"></button>
                            <button><img src="icon/trash-icon.png"></button>
                        </div>
            </div>
        </div>
        <div class="card-game">
            <img src="gambar-game/lego-batman.jpg">
            <div class="info-game">
            <h3>Lego Batman: Legacy of the dark knight</h3>
            <div class="detail">
                <label>Genre</label>
                <span>Action</span>
            </div>
            <div class="detail">
                <label>Platform</label>
                <span>Steam</span>
            </div>
            <div class="detail">
                <label>Status</label>
                <span>Belum dimainkan</span>
            </div>
            <div class="detail">
                <label>Rating</label>
                <span>-</span>
            </div>
                 <div class="tombol">
                            <button><img src="icon/mdi--heart-outline.png"></button>
                            <button><img src="icon/edit-outline.png"></button>
                            <button><img src="icon/trash-icon.png"></button>
                        </div>
            </div>
        </div>
        <div class="card-game">
            <label>Persona 5 Royal</label>
        </div>
        <div class="card-game">
    
        </div>
    </div>
    <script>
        const menu = document.getElementById("box-option");
        const button = document.querySelector(".profile");
        function profile(){
            menu.classList.toggle("active");
            }
        document.addEventListener("click", function(event){
        if(!menu.contains(event.target) &&!button.contains(event.target)){
        menu.classList.remove("active");
        }
        });

        function bukaTG() {
            document.getElementById("overlay").style.display = "flex";
        }
        function tutupTG(){
            document.getElementById("overlay").style.display = "none";
        }
    </script>
</body>
</html>
